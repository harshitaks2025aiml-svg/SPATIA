<style>
/* Layout: sticky header with college identity + role switch, scrolling nav, one page per module, photo as fixed backdrop under a theme veil */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F3F5F8; --fg:#13202B; --muted:#586878; --line:#D3DAE1;
  --accent:#2447B8; --accent-fg:#FFFFFF; --accent-soft:#E1E8FA;
  --free:#17724F; --free-soft:#DAF0E6; --warn:#8A5B00; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#F9DEDB;
  --veil:rgba(237,240,243,.9); --shadow:0 1px 2px rgba(19,32,43,.06),0 8px 24px rgba(19,32,43,.06);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C141B; --surface:#141F29; --surface-2:#1A2733; --fg:#E6ECF2; --muted:#93A3B3; --line:#2A3947;
    --accent:#8DA6FF; --accent-fg:#0C141B; --accent-soft:#1E2A52;
    --free:#5FD3A1; --free-soft:#12392B; --warn:#F0C25E; --warn-soft:#3D2F0A; --bad:#FF8A80; --bad-soft:#451A17;
    --veil:rgba(12,20,27,.9); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#141F29; --surface-2:#1A2733; --fg:#E6ECF2; --muted:#93A3B3; --line:#2A3947;
  --accent:#8DA6FF; --accent-fg:#0C141B; --accent-soft:#1E2A52;
  --free:#5FD3A1; --free-soft:#12392B; --warn:#F0C25E; --warn-soft:#3D2F0A; --bad:#FF8A80; --bad-soft:#451A17;
  --veil:rgba(12,20,27,.9); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bgphoto{position:fixed;inset:0;z-index:0;background:var(--photo,none) center/cover no-repeat}
.bgphoto::after{content:"";position:absolute;inset:0;background:var(--veil)}
header.top,main,footer.foot{position:relative;z-index:1}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.logo{width:42px;height:42px;flex:none;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand-t b{font-family:var(--f-display);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-t small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.role{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2)}
.role button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;padding:10px 13px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{padding-block:20px 56px}
.pagehead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.pagehead h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:700}
.pagehead p{color:var(--muted);max-width:68ch}
.tagline{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.hero{position:relative;overflow:hidden;border-radius:20px;color:#fff;
  background:linear-gradient(180deg,rgba(8,16,26,.45),rgba(8,16,26,.88)),var(--photo,linear-gradient(160deg,#1a3a5e,#0d1824));background-size:cover;background-position:center;
  padding:clamp(24px,5vw,48px) clamp(16px,4vw,40px) 18px;margin-bottom:22px}
.hero-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%;opacity:.14;pointer-events:none}
.has-photo .hero-art{display:none}
.hero-in{position:relative;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(3.2rem,13vw,6.2rem);font-weight:800;letter-spacing:-.035em;line-height:.95}
.lead{max-width:56ch;font-size:clamp(15px,2.4vw,18px);opacity:.92}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;align-items:end;padding:14px;margin-top:6px;color:var(--fg)}
.brandbar{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.link{background:none;border:0;padding:4px 0;cursor:pointer;color:#fff;opacity:.85;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:hover{opacity:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:1.15rem;font-weight:700;margin:26px 0 12px}
.sub{color:var(--muted);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none;min-height:42px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
input,select,textarea{font:inherit;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea{min-height:84px;resize:vertical}
input[type="checkbox"]{width:auto;min-height:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);font-weight:500;letter-spacing:0}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.free{background:var(--free-soft);color:var(--free)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.code{font-family:var(--f-mono);font-weight:500;font-size:18px}
.mono{font-family:var(--f-mono)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--surface)}

/* spaces */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.blk{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.blk span{font-size:13px;color:var(--muted)}
.blk.on{border-color:var(--accent);background:var(--accent-soft)}
.blkwrap{position:relative}
.blkwrap .x{position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 6px;border-radius:6px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:14px;align-items:end;margin-bottom:16px}
.sp{padding:14px;display:flex;flex-direction:column;gap:8px}
.sp header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp .meta{color:var(--muted);font-size:13px}
.sp .cap b{font-family:var(--f-display);font-size:22px}
.sp .fac{display:flex;flex-wrap:wrap;gap:5px}
.sp footer{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}

/* timetable */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tt{border-collapse:collapse;width:100%;min-width:700px}
table.tt th,table.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top}
table.tt th:last-child,table.tt td:last-child{border-right:0}
table.tt tr:last-child th,table.tt tr:last-child td{border-bottom:0}
table.tt thead th{padding:10px;font-size:13px;background:var(--surface-2);text-align:left}
table.tt tbody th{padding:8px 10px;text-align:left;font-size:13px;white-space:nowrap;background:var(--surface-2);width:92px}
table.tt tbody th small{display:block;font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:11px}
.cell{display:block;width:100%;min-height:56px;padding:8px 10px;border:0;background:transparent;text-align:left;font-size:12.5px;line-height:1.35;color:var(--muted)}
button.cell{cursor:pointer}
.cell.on{background:var(--accent-soft);color:var(--fg)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.windows{display:grid;gap:8px}
.win{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 12px}
.win b{min-width:44px}
.slot{font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--free-soft);color:var(--free)}

/* find + results */
.res{display:flex;flex-direction:column;gap:8px;padding:14px}
.res header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res .row{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px}
.res footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
details.na{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.na summary{padding:12px 14px;cursor:pointer;font-weight:600}
details.na ul{list-style:none;margin:0;padding:0 14px 8px}
details.na li{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
details.na li span{color:var(--muted)}

/* requests and issues */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.item{padding:14px;display:flex;flex-direction:column;gap:8px}
.item header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .row{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.steps{display:flex;list-style:none;margin:2px 0 0;padding:0;gap:6px}
.steps li{flex:1;font-size:12px;color:var(--muted);padding-top:8px;border-top:3px solid var(--line)}
.steps li.done{border-top-color:var(--free);color:var(--fg)}
.steps li.cur{border-top-color:var(--accent);color:var(--fg);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.form h2{font-size:1.25rem}
.form .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.formcard{padding:16px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px;display:flex;flex-direction:column;gap:2px;text-decoration:none}
.kpi b{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:1rem}
.bar{display:grid;grid-template-columns:minmax(70px,120px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bt{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bt i{display:block;height:100%;background:var(--accent);border-radius:6px 0 0 6px}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.heat{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:3px;font-size:12px}
.heat div{padding:8px 2px;text-align:center;border-radius:5px;font-variant-numeric:tabular-nums}
.heat .h{color:var(--muted);font-weight:600;padding:4px 0;background:none}
.heat .p{color:var(--muted);font-family:var(--f-mono);background:none;text-align:left;padding-left:0}
table.plain{width:100%;border-collapse:collapse;font-size:14px}
table.plain th,table.plain td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
table.plain th{font-size:12px;color:var(--muted);border-top:0}
table.plain td:last-child,table.plain th:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* home */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mod{padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.mod h3{font-size:1.1rem}
.mod p{color:var(--muted);font-size:14px}
.mod .go{margin-top:auto;font-weight:600;color:var(--accent);font-size:14px;padding-top:6px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,12,18,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:18px;padding:24px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
footer.foot{padding-block:0 40px;color:var(--muted);font-size:13px}
@media(max-width:720px){.two{grid-template-columns:minmax(0,1fr)}.brand-t b{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
(function(){

var store={

};

/* ---------- time helpers ---------- */
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var TYPES=['Classroom','Lab','Seminar Hall','Study Space'];

/* ---------- core logic ---------- */
function classAt(id,d,k){var key=id+'|'+d+'|'+k;if(Object.prototype.hasOwnProperty.call(ttOver,key))return ttOver[key];return ttBase[key]||null}
function blockedByMaint(sp){return issues.find(function(i){return i.spaceId===sp.id&&i.sev==='High'&&i.status!=='Resolved'})}
function busy(sp,date,ignoreId){
  var out=[],d=dow(date);
  if(d>=1&&d<=5)PERIODS.forEach(function(p,i){var c=classAt(sp.id,d,i+1);if(c)out.push({s:p[0],e:p[1],kind:'class',label:c})});
  bookings.forEach(function(b){
    if(b.spaceId===sp.id&&b.date===date&&b.id!==ignoreId&&(b.status==='Pending'||b.status==='Approved'))
      out.push({s:toMin(b.from),e:toMin(b.to),kind:b.status==='Approved'?'booked':'pending',label:b.purpose});
  });
  return out.sort(function(a,b){return a.s-b.s});
}
/* overlap rule: two intervals clash when each starts before the other ends */
function check(sp,date,s,e,ignoreId){
  if(!sp.active)return {ok:false,reason:'Not in service'};
  if(blockedByMaint(sp))return {ok:false,reason:'Under maintenance'};
  var c=busy(sp,date,ignoreId).find(function(x){return x.s<e&&s<x.e});
  if(c)return {ok:false,reason:(c.kind==='class'?'Class: ':c.kind==='booked'?'Booked: ':'Pending request: ')+c.label+' ('+fmt(c.s)+'–'+fmt(c.e)+')'};
  return {ok:true};
}
function gapsFrom(bs){
  var cur=DAY_START,g=[];
  bs.slice().sort(function(a,b){return a.s-b.s}).forEach(function(b){if(b.s>cur)g.push([cur,b.s]);cur=Math.max(cur,b.e)});
  if(cur<DAY_END)g.push([cur,DAY_END]);
  return g.filter(function(x){return x[1]-x[0]>=20});
}
function freeGaps(sp,date){return gapsFrom(busy(sp,date))}
function classGaps(sp,d){
  var bs=[];PERIODS.forEach(function(p,i){if(classAt(sp.id,d,i+1))bs.push({s:p[0],e:p[1]})});return gapsFrom(bs);
}
function refSlot(){
  var now=new Date(),date=iso(now),m=now.getHours()*60+now.getMinutes();
  if(dow(date)===0||dow(date)===6)return {date:nextWorking(date),k:1,live:false};
  var idx=-1;for(var i=0;i<PERIODS.length;i++){if(m<PERIODS[i][1]){idx=i;break}}
  if(idx===-1)return {date:nextWorking(addDays(date,1)),k:1,live:false};
  return {date:date,k:idx+1,live:m>=PERIODS[idx][0]};
}
function weekDates(){var t=todayISO(),d=dow(t),mon=addDays(t,d===0?-6:1-d);return [0,1,2,3,4].map(function(i){return addDays(mon,i)})}
function occ(sp,date){
  var set={};
  busy(sp,date).forEach(function(b){if(b.kind==='pending')return;PERIODS.forEach(function(p,i){if(b.s<p[1]&&p[0]<b.e)set[i+1]=1})});
  return set;
}
function util(sp){var n=0;weekDates().forEach(function(d){n+=Object.keys(occ(sp,d)).length});return n/40}
function teaching(){return spaces.filter(function(s){return s.active&&s.type!=='Study Space'})}
function sortedSpaces(){
  var order=blocks.map(function(b){return b.id});
  return spaces.slice().sort(function(a,b){var x=order.indexOf(a.building)-order.indexOf(b.building);if(x)return x;if(a.floor!==b.floor)return a.floor-b.floor;return String(a.code).localeCompare(String(b.code),undefined,{numeric:true})});
}
function blockName(id){var b=blocks.find(function(x){return x.id===id});return b?b.name:id}
function spaceById(id){return spaces.find(function(s){return s.id===id})}
function firstFreePeriod(sp,date,from){
  for(var j=0;j<8;j++){var k=((from-1+j)%8)+1;if(check(sp,date,PERIODS[k-1][0],PERIODS[k-1][1]).ok)return k}
  return null;
}

function readImage(file,max,type,cb){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();
    img.onload=function(){var sc=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL(type,.82))};
    img.onerror=function(){toast('That file could not be read as an image.')};img.src=fr.result};
  fr.readAsDataURL(file);
}

/* Timetable (module 2) */

  }

    editor='<form class="card formcard form" id="ttForm" style="margin-top:12px"><label for="ttText">'+DAYS[sel.d]+' · Period '+sel.k+' · '+fmt(PERIODS[sel.k-1][0])+'–'+fmt(PERIODS[sel.k-1][1])+'</label><input id="ttText" maxlength="60" placeholder="Class or group, for example CSE-II A · Data Structures" value="'+esc(cur)+'"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="submit">Save class</button><button type="button" class="btn sm ghost" data-act="tt-clear">Clear this period</button><button type="button" class="btn sm ghost" data-act="tt-close">Done</button></div></form>';

  }
  return '<div class="scroll"><table class="tt"><thead><tr><th>Period</th>'+[1,2,3,4,5].map(function(d){return '<th>'+DAYS[d]+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (isAdmin()?(sp.type==='Study Space'?'<p class="sub" style="margin-top:10px">Study spaces are open all day and have no class timetable.</p>':'<p class="sub" style="margin-top:10px">Select a cell to add, change or clear a class.</p>'):'')+editor+

function renderTimetable(){

/* Find a space (modules 2 and 3) */
function resultsHTML(){
  var f=st.find,s=toMin(f.from),e=toMin(f.to);
  if(!f.date||!(e>s))return '<div class="empty">Choose a date, and a start time that is earlier than the end time.</div>';
  var size=parseInt(f.size,10)||0;
  var pool=sortedSpaces().filter(function(sp){return sp.active&&(!f.block||sp.building===f.block)&&(!f.type||sp.type===f.type)});
  var small=pool.filter(function(sp){return sp.capacity<size}).length;
  var list=pool.filter(function(sp){return sp.capacity>=size});
  var ok=[],no=[];
  list.forEach(function(sp){var r=check(sp,f.date,s,e);(r.ok?ok:no).push({sp:sp,r:r})});
  ok.sort(function(a,b){return a.sp.capacity-b.sp.capacity});
  var head='<p class="sub" style="margin:4px 0 12px"><b>'+ok.length+'</b> of '+list.length+' spaces are free on '+esc(pretty(f.date))+', '+esc(f.from)+'–'+esc(f.to)+(size?' for '+size+' people':'')+(small?'. '+small+' were left out because they seat fewer.':'.')+(dow(f.date)===0||dow(f.date)===6?' No classes run on weekends.':'')+'</p>';
  var cards=ok.length?'<div class="grid wide">'+ok.map(function(x,i){
    var sp=x.sp,g=freeGaps(sp,f.date).find(function(q){return q[0]<=s&&q[1]>=e});
    return '<article class="card res"><header><span class="code">'+esc(sp.code)+'</span>'+(size&&i===0?'<span class="pill info">Best fit</span>':'<span class="pill free">Free</span>')+'</header>'+
      '<div class="row"><span>'+esc(sp.type)+'</span><span>'+esc(blockName(sp.building))+', floor '+sp.floor+'</span></div>'+
      '<div class="row"><span><b style="color:var(--fg)">'+sp.capacity+'</b> seats'+(size?' · '+(sp.capacity-size)+' spare':'')+'</span>'+(g?'<span>Free window '+fmt(g[0])+'–'+fmt(g[1])+'</span>':'')+'</div>'+
      '<p class="fac" style="display:flex;flex-wrap:wrap;gap:5px">'+sp.facilities.slice(0,4).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</p>'+
      '<footer><button class="btn sm ghost" data-act="detail" data-id="'+sp.id+'">Details</button><button class="btn sm" data-act="request" data-id="'+sp.id+'">Request</button></footer></article>';
  }).join('')+'</div>':'<div class="empty">No space is free for this time. Try another period, a different block, or a smaller group.</div>';
  var na=no.length?'<details class="na"><summary>'+no.length+' not available</summary><ul>'+no.map(function(x){return '<li><b class="mono">'+esc(x.sp.code)+'</b><span>'+esc(x.r.reason)+'</span></li>'}).join('')+'</ul></details>':'';
  return head+cards+na;
}

/* Maintenance (module 4) */
function issueListHTML(){
  var show=st.mt.show;
  var l=issues.slice().sort(function(a,b){return b.reported.localeCompare(a.reported)}).filter(function(i){return show==='All'||(show==='Open'?i.status!=='Resolved':i.status==='Resolved')});
  if(!l.length)return '<div class="empty">'+(show==='Open'?'No open issues. Every reported problem has been resolved.':'Nothing to show here.')+'</div>';
  var order=['Reported','In progress','Resolved'];

    var sp=spaceById(i.spaceId),idx=order.indexOf(i.status);

/* Dashboard (module 4) */
function renderDashboard(){
  var rs=refSlot(),p=PERIODS[rs.k-1],tch=teaching(),wd=weekDates();
  var active=spaces.filter(function(s){return s.active});
  var free=active.filter(function(s){return check(s,rs.date,p[0],p[1]).ok}).length;
  var avg=tch.length?tch.reduce(function(a,s){return a+util(s)},0)/tch.length:0;
  var openI=issues.filter(function(i){return i.status!=='Resolved'}).length,pend=bookings.filter(function(b){return b.status==='Pending'}).length;
  var occs=tch.map(function(s){return wd.map(function(d){return occ(s,d)})});
  var heat=wd.map(function(d,di){return PERIODS.map(function(_,k){return tch.length?occs.filter(function(o){return o[di][k+1]}).length/tch.length:0})});
  var peak={v:-1},quiet={v:2};
  heat.forEach(function(row,di){row.forEach(function(v,k){if(v>peak.v)peak={v:v,d:di,k:k};if(v<quiet.v)quiet={v:v,d:di,k:k}})});
  function bars(rows){return rows.map(function(r){var pc=Math.round(r[1]*100);return '<div class="bar"><span>'+esc(r[0])+'</span><span class="bt"><i style="width:'+pc+'%"></i></span><span class="bv">'+pc+'%</span></div>'}).join('')}
  var byBlock=blocks.map(function(b){var l=tch.filter(function(s){return s.building===b.id});return l.length?[b.name,l.reduce(function(a,s){return a+util(s)},0)/l.length]:null}).filter(Boolean);
  var byType=['Classroom','Lab','Seminar Hall'].map(function(t){var l=tch.filter(function(s){return s.type===t});return l.length?[t+'s',l.reduce(function(a,s){return a+util(s)},0)/l.length]:null}).filter(Boolean);
  var ranked=tch.map(function(s){return {s:s,u:util(s)}}).sort(function(a,b){return a.u-b.u});
  var low=ranked.slice(0,5),high=ranked.slice(-5).reverse();
  function tbl(l){return '<table class="plain"><thead><tr><th>Room</th><th>Type</th><th>Seats</th><th>Use</th></tr></thead><tbody>'+l.map(function(x){return '<tr><td class="mono">'+esc(x.s.code)+'</td><td>'+esc(x.s.type)+'</td><td>'+x.s.capacity+'</td><td>'+Math.round(x.u*100)+'%</td></tr>'}).join('')+'</tbody></table>'}
  var heatHTML='<div class="heat"><div class="h"></div>'+wd.map(function(d){return '<div class="h">'+DAYS[dow(d)]+'</div>'}).join('');
  for(var k=0;k<8;k++){heatHTML+='<div class="p">P'+(k+1)+'</div>';for(var di=0;di<5;di++){var v=heat[di][k],pc=Math.round(v*100);heatHTML+='<div style="background:color-mix(in srgb,var(--accent) '+pc+'%,var(--surface-2));color:'+(pc>50?'var(--accent-fg)':'var(--fg)')+'">'+pc+'</div>'}}
  heatHTML+='</div>';
  var cats={};issues.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1});
  var catRows=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}).slice(0,5);
  var stCount=function(s){return issues.filter(function(i){return i.status===s}).length};
  return '<div class="pagehead"><span class="tagline">Maintenance module</span><h1>Dashboard</h1><p>Availability, utilization and repair status for the week of '+esc(pretty(wd[0]))+'.</p></div>'+
  '<div class="kpis">'+
    '<div class="card kpi"><b>'+free+' / '+active.length+'</b><span>Free in Period '+rs.k+' · '+esc(pretty(rs.date))+' '+fmt(p[0])+(rs.live?' (now)':' (next)')+'</span></div>'+
    '<div class="card kpi"><b>'+Math.round(avg*100)+'%</b><span>Weekly use of teaching spaces</span></div>'+
    '<a class="card kpi" href="#requests"><b>'+pend+'</b><span>Requests waiting</span></a>'+
    '<a class="card kpi" href="#maintenance"><b>'+openI+'</b><span>Open issues</span></a></div>'+
  '<h2 class="sec-title">Utilization</h2><div class="panels">'+
    '<section class="card panel"><h3>Use by block</h3>'+bars(byBlock)+'<p class="sub">Share of the 40 weekly periods that carry a class or approved booking.</p></section>'+
    '<section class="card panel"><h3>Use by space type</h3>'+bars(byType)+'</section>'+
    '<section class="card panel" style="grid-column:1/-1"><h3>Campus occupancy by period (%)</h3><div style="overflow-x:auto">'+heatHTML+'</div><p class="sub">Busiest slot: '+DAYS[dow(wd[peak.d])]+' Period '+(peak.k+1)+' at '+Math.round(peak.v*100)+'%. Quietest slot: '+DAYS[dow(wd[quiet.d])]+' Period '+(quiet.k+1)+' at '+Math.round(quiet.v*100)+'%.</p></section>'+
  '</div><h2 class="sec-title">Reports</h2><div class="panels">'+
    '<section class="card panel"><h3>Least used teaching rooms</h3><div style="overflow-x:auto">'+tbl(low)+'</div><p class="sub">Rooms with the most idle periods are the first to consider for extra batches.</p></section>'+
    '<section class="card panel"><h3>Most used teaching rooms</h3><div style="overflow-x:auto">'+tbl(high)+'</div></section>'+
    '<section class="card panel"><h3>Maintenance summary</h3><table class="plain"><tbody><tr><td>Reported</td><td>'+stCount('Reported')+'</td></tr><tr><td>In progress</td><td>'+stCount('In progress')+'</td></tr><tr><td>Resolved</td><td>'+stCount('Resolved')+'</td></tr></tbody></table>'+(catRows.length?'<h3 style="margin-top:6px">Most reported</h3><table class="plain"><tbody>'+catRows.map(function(c){return '<tr><td>'+esc(c)+'</td><td>'+cats[c]+'</td></tr>'}).join('')+'</tbody></table>':'')+'</section>'+
  '</div>';
}

/* ---------- router ---------- */
var ROUTES={home:renderHome,spaces:renderSpaces,timetable:renderTimetable,find:renderFind,requests:renderRequests,maintenance:renderMaintenance,dashboard:renderDashboard};
var NAV=[['home','Home'],['spaces','Spaces'],['timetable','Timetable'],['find','Find a space'],['requests','My requests'],['maintenance','Maintenance'],['dashboard','Dashboard']];
var cur='home';
function buildNav(){$('#nav').innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'"'+(n[0]===cur?' aria-current="page"':'')+'>'+n[1]+'</a>'}).join('')}
function route(scroll){
  var h=(location.hash||'#home').slice(1);cur=ROUTES[h]?h:'home';
  $('#view').innerHTML=ROUTES[cur]();buildNav();
  if(scroll!==false)window.scrollTo(0,0);
  var a=$('#nav [aria-current="page"]');if(a&&a.scrollIntoView)try{a.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function rerender(){var y=window.scrollY;route(false);window.scrollTo(0,y)}
window.addEventListener('hashchange',function(){route(true)});

var PART={
  spaces:function(){$('#spList').innerHTML=spaceListHTML();$('#blkStrip').innerHTML=blocksHTML()},
  results:function(){$('#results').innerHTML=resultsHTML()},
  tt:function(){$('#ttBox').innerHTML=ttHTML()}
};

/* ---------- input handling ---------- */
function onInput(e){
  var t=e.target;
  if(t.id==='fPeriod'){
    if(t.value){var p=PERIODS[+t.value-1];st.find.from=fmt(p[0]);st.find.to=fmt(p[1]);$('#fFrom').value=st.find.from;$('#fTo').value=st.find.to;PART.results()}
    return;
  }
  var m=t.dataset&&t.dataset.m;if(!m)return;
  var a=m.split('.');st[a[0]][a[1]]=t.value;
  if(m==='tt.space')st.tt.sel=null;
  if(m==='find.from'||m==='find.to'){var pp=$('#fPeriod');if(pp)pp.value=String(periodOf(st.find.from,st.find.to))}
  var r=t.dataset.r;if(r&&PART[r])PART[r]();
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);

/* ---------- actions ---------- */
var ACT={
  'close-modal':function(){closeModal()},
  'detail':function(t){openDetail(t.dataset.id)},
  'request':function(t){openRequest(t.dataset.id)},
  'to-tt':function(t){st.tt.space=t.dataset.id;st.tt.sel=null;closeModal()},
  'add-space':function(){openModal(spaceFormHTML())},
  'edit-space':function(t){openModal(spaceFormHTML(spaceById(t.dataset.id)))},
  'del-space':function(t){
    if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Confirm delete';setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent='Delete'}},3500);return}
    var id=t.dataset.id;spaces=spaces.filter(function(s){return s.id!==id});bookings=bookings.filter(function(b){return b.spaceId!==id});issues=issues.filter(function(i){return i.spaceId!==id});
    Object.keys(ttOver).forEach(function(k){if(k.indexOf(id+'|')===0)delete ttOver[k]});sv();toast('Space deleted.');rerender();
  },
  'add-block':function(){openModal('<form class="form" id="blockForm"><h2>Add a block</h2><div class="pair"><div><label for="bId">Short code</label><input id="bId" required maxlength="3" placeholder="D"></div><div><label for="bFloors">Floors</label><input id="bFloors" type="number" min="1" max="20" required value="3"></div></div><div><label for="bName">Block name</label><input id="bName" required maxlength="40" placeholder="Block D"></div><div><label for="bNote">Description</label><input id="bNote" maxlength="60" placeholder="Optional"></div><p class="err" id="formErr" role="alert"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn" type="submit">Add block</button></div></form>')},
  'del-block':function(t){blocks=blocks.filter(function(b){return b.id!==t.dataset.id});if(st.sp.block===t.dataset.id)st.sp.block='';sv();rerender();toast('Block removed.')},
  'filter-block':function(t){st.sp.block=st.sp.block===t.dataset.id?'':t.dataset.id;rerender()},
  'tt-cell':function(t){st.tt.sel={d:+t.dataset.d,k:+t.dataset.k};PART.tt();var i=$('#ttText');if(i)i.focus()},
  'tt-clear':function(){var s=st.tt.sel;if(!s)return;ttOver[st.tt.space+'|'+s.d+'|'+s.k]=null;sv();PART.tt();toast('Period cleared.')},
  'tt-close':function(){st.tt.sel=null;PART.tt()},
  'rq-tab':function(t){st.rq.tab=t.dataset.id;rerender()},
  'mt-tab':function(t){st.mt.show=t.dataset.id;rerender()},
  'bk-cancel':function(t){var b=bookings.find(function(x){return x.id===t.dataset.id});if(!b)return;b.status='Cancelled';b.decided=new Date().toISOString();sv();rerender();toast('Request cancelled. The slot is free again.')},
  'bk-approve':function(t){
    var b=bookings.find(function(x){return x.id===t.dataset.id}),sp=b&&spaceById(b.spaceId);if(!b||!sp)return;
    var r=check(sp,b.date,toMin(b.from),toMin(b.to),b.id);
    if(!r.ok){toast('Cannot approve. '+r.reason);return}
    b.status='Approved';b.decided=new Date().toISOString();sv();rerender();toast('Request approved.');
  },
  'bk-reject':function(t){var b=bookings.find(function(x){return x.id===t.dataset.id});if(!b)return;b.status='Rejected';b.decided=new Date().toISOString();sv();rerender();toast('Request rejected.')},
  'is-next':function(t){var i=issues.find(function(x){return x.id===t.dataset.id});if(!i)return;i.status=i.status==='Reported'?'In progress':'Resolved';sv();rerender();toast(i.status==='Resolved'?'Issue resolved.':'Work started.')},
  'pick-photo':function(){$('#photoIn').click()},
  'pick-logo':function(){$('#logoIn').click()},
  'reset-brand':function(){store.del('photo');store.del('logo');applyBrand();toast('Branding reset.')}
};
document.addEventListener('click',function(e){
  if(e.target.id==='modal'){closeModal();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var fn=ACT[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-role]');if(!b)return;
  role=b.dataset.role;store.set('role',role);syncRole();rerender();
});
function syncRole(){document.querySelectorAll('[data-role]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.role===role))})}

/* ---------- forms ---------- */
function setErr(m){var e=$('#formErr');if(e)e.textContent=m}
var FORMS={
  quickForm:function(){
    var f=st.find;f.date=$('#qDate').value;f.from=$('#qFrom').value;f.to=$('#qTo').value;f.size=$('#qSize').value;
    location.hash='#find';
  },
  spaceForm:function(form){
    var id=form.dataset.id,code=$('#fCode').value.trim().toUpperCase(),cap=parseInt($('#fCap').value,10),floor=parseInt($('#fFloor').value,10);
    if(!code)return setErr('Enter a room code.');
    if(spaces.some(function(s){return s.code===code&&s.id!==id}))return setErr('A space with code '+code+' already exists.');
    if(!(cap>=1))return setErr('Capacity must be at least 1.');
    var rec={code:code,building:$('#fBlock').value,floor:isNaN(floor)?0:floor,type:$('#fTypeSel').value,capacity:cap,facilities:$('#fFac').value.split(',').map(function(x){return x.trim()}).filter(Boolean),active:$('#fActive').checked};
    if(id){var s=spaceById(id);Object.keys(rec).forEach(function(k){s[k]=rec[k]});toast('Space updated.')}
    else{rec.id='s'+Date.now();spaces.push(rec);toast('Space added.')}
    sv();closeModal();rerender();
  },
  blockForm:function(){
    var id=$('#bId').value.trim().toUpperCase(),name=$('#bName').value.trim();
    if(!id||!name)return setErr('Enter a code and a name.');
    if(blocks.some(function(b){return b.id===id}))return setErr('Code '+id+' is already used.');
    blocks.push({id:id,name:name,note:$('#bNote').value.trim(),floors:parseInt($('#bFloors').value,10)||1});
    sv();closeModal();rerender();toast('Block added.');
  },
  ttForm:function(){
    var s=st.tt.sel,v=$('#ttText').value.trim();if(!s)return;
    ttOver[st.tt.space+'|'+s.d+'|'+s.k]=v||null;sv();PART.tt();toast(v?'Class saved.':'Period cleared.');
  },
  reqForm:function(form){
    var sp=spaceById(form.dataset.id);if(!sp)return;
    var date=$('#rDate').value,from=$('#rFrom').value,to=$('#rTo').value,s=toMin(from),e=toMin(to),att=parseInt($('#rAtt').value,10);
    var purpose=$('#rPurpose').value.trim(),by=$('#rBy').value.trim();
    if(!date||date<todayISO())return setErr('Pick today or a later date.');
    if(!(e>s))return setErr('The start time must be earlier than the end time.');
    if(!purpose||!by)return setErr('Fill in the purpose and your name.');
    if(!(att>=1)||att>sp.capacity)return setErr('This space seats '+sp.capacity+'. Enter a number of people up to that.');
    var r=check(sp,date,s,e);if(!r.ok)return setErr('Not available. '+r.reason);
    profile={name:by,roll:$('#rRoll').value.trim()};store.set('profile',profile);
    bookings.push({id:'b'+Date.now(),spaceId:sp.id,date:date,from:from,to:to,purpose:purpose,by:by,roll:profile.roll,attendees:att,status:'Pending',created:new Date().toISOString()});
    sv();closeModal();toast('Request sent. It is pending review.');
    if(cur==='requests')rerender();else location.hash='#requests';
  },
  issueForm:function(){
    var d=$('#iDesc').value.trim();if(!d)return setErr('Describe the problem.');
    var sev=$('#iSev').value;
    issues.push({id:'i'+Date.now(),spaceId:$('#iSpace').value,cat:$('#iCat').value,sev:sev,desc:d,status:'Reported',reported:todayISO(),by:isAdmin()?'Admin':'Student'});
    sv();st.mt.show='Open';rerender();toast(sev==='High'?'Issue reported. The space is hidden from search until it is resolved.':'Issue reported.');
  }
};
document.addEventListener('submit',function(e){e.preventDefault();var f=FORMS[e.target.id];if(f)f(e.target)});

/* ---------- start ---------- */
applyBrand();syncRole();route(false);
})();
</script>

</body></html>
