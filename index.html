<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPATIA | Smart Space Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <span>✦</span> SPATIA
        </div>

        <div class="nav-text">
            Smart Campus Space Management
        </div>
    </header>


    <main>

        <section class="hero">
            <p class="tag">SMART CAMPUS</p>

            <h1>Find Your Perfect<br>
                <span>Campus Space</span>
            </h1>

            <p class="subtitle">
                Check classroom and laboratory availability
                instantly based on date and time.
            </p>
        </section>


        <section class="search-card">

            <h2>Find Available Space</h2>

            <div class="form-grid">

                <div class="input-box">
                    <label>📅 Date</label>
                    <input type="date" id="date">
                </div>

                <div class="input-box">
                    <label>🕐 From</label>
                    <input type="time" id="startTime">
                </div>

                <div class="input-box">
                    <label>🕐 To</label>
                    <input type="time" id="endTime">
                </div>

            </div>


            <div class="space-selection">

                <p>Select Space Type</p>

                <div class="type-buttons">

                    <button
                        id="classroomBtn"
                        onclick="selectType('Classroom')">
                        🏫 Classroom
                    </button>

                    <button
                        id="labBtn"
                        onclick="selectType('Lab')">
                        🧪 Laboratory
                    </button>

                </div>

            </div>


            <button class="search-btn" onclick="searchSpaces()">
                FIND AVAILABLE SPACES
                <span>→</span>
            </button>

        </section>


        <section id="results"></section>

    </main>


    <footer>
        <p>SPATIA © 2026 | Smart Campus Space Optimization</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
